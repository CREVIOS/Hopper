# Local dev infrastructure (HOP-22 25.4): credentials are parameterized via
# environment variables with dev-safe defaults, so nothing here is a real
# secret — copy .env.example to .env (compose reads it automatically) to
# override. Production runs on K8s with cluster Secrets, never this file.
services:
  postgres:
    image: timescale/timescaledb:latest-pg16@sha256:0af03ecf697825f6ddae76fd275d16bf46007bed6d00eb3d754779cb7db96fa6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hopper}
      POSTGRES_USER: ${POSTGRES_USER:-hopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hopper_dev}
    ports:
      # Default 5433 (what CI and the test-suite dial). Override per-machine via
      # POSTGRES_PORT in the gitignored root .env — e.g. 5434 when a host
      # Postgres already squats on 5433.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopper}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hopper}
      KC_DB_USERNAME: ${POSTGRES_USER:-hopper}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-hopper_dev}
    ports:
      - "8080:8080"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  # Local mail-catcher: captures signup/verification/reset emails so the flow is
  # testable without a real mail server. SMTP on :1025 (plain), web inbox on
  # :8025. Point the API at it with HOPPER_SMTP_HOST=localhost /
  # HOPPER_SMTP_PORT=1025 / HOPPER_SMTP_TLS=none. Swap for a real relay
  # (Gmail/SendGrid, STARTTLS on 587) in production.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
