services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: hopper
      POSTGRES_USER: hopper
      POSTGRES_PASSWORD: hopper_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopper"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hopper
      KC_DB_USERNAME: hopper
      KC_DB_PASSWORD: hopper_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Local mail-catcher: captures signup/verification/reset emails so the flow is
  # testable without a real mail server. SMTP on :1025 (plain), web inbox on
  # :8025. Point the API at it with HOPPER_SMTP_HOST=localhost /
  # HOPPER_SMTP_PORT=1025 / HOPPER_SMTP_TLS=none. Swap for a real relay
  # (Gmail/SendGrid, STARTTLS on 587) in production.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
