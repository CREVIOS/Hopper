# images/hopper-vm/config/supervisord.conf
[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:code-server]
# code-server runs with `auth: none` (see code-server-config.yaml) — the
# platform gates access, not code-server. We therefore do NOT set $PASSWORD:
# referencing an unset %(ENV_...)s here would make supervisord fail to expand
# the environment and refuse to start code-server at all. Auto-restart with a
# small back-off so a continuously-failing process surfaces as a crash loop
# instead of pegging CPU on respawns.
command=/usr/bin/code-server --config /root/.config/code-server/config.yaml --trusted-origins=https://hopper.farefin.com /workspace
autostart=true
autorestart=true
startsecs=5
startretries=3
environment=HOME="/root",USER="root"
stderr_logfile=/var/log/supervisor/code-server.err.log
stdout_logfile=/var/log/supervisor/code-server.out.log
