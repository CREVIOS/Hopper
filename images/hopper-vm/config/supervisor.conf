# images/hopper-vm/config/supervisord.conf
[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:code-server]
# code-server reads $PASSWORD at start-up so we just have to inherit the env
# from the pod (where the orchestrator sets it). Auto-restart with a small
# back-off so a continuously-failing process surfaces as a crash loop instead
# of pegging CPU on respawns.
command=/usr/bin/code-server --config /root/.config/code-server/config.yaml --trusted-origins=https://hopper.farefin.com /workspace
autostart=true
autorestart=true
startsecs=5
startretries=3
environment=HOME="/root",USER="root",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s"
stderr_logfile=/var/log/supervisor/code-server.err.log
stdout_logfile=/var/log/supervisor/code-server.out.log

[program:hopper-provisioner]
# One-shot first-boot provisioner for Smart Sandbox VMs. Fetches and runs the
# generated provision.sh (dependencies, frameworks, VS Code extensions, services)
# then exits. Idempotent via /workspace/.hopper-provisioned. Not restarted:
# autorestart=false + startsecs=0 + exitcodes=0 so a clean exit is not treated as
# a crash. On a plain (non-sandbox) VM it detects HOPPER_PROVISION!=1 and no-ops.
command=/usr/bin/python3 /usr/local/bin/hopper-provisioner.py
autostart=true
autorestart=false
startsecs=0
exitcodes=0
startretries=0
environment=HOME="/root",USER="root"
stderr_logfile=/var/log/supervisor/hopper-provisioner.err.log
stdout_logfile=/var/log/supervisor/hopper-provisioner.out.log

[program:hopper-idle-agent]
# Reports SSH/code-server/shell activity to the API gateway so idle VMs get a
# warning (broadcast via wall) before being reclaimed to save student credits.
# Reads HOPPER_POD_ID / HOPPER_API_URL / HOPPER_POD_TOKEN from the pod env.
command=/usr/bin/python3 /usr/local/bin/hopper-idle-agent.py
autostart=true
autorestart=true
startsecs=3
environment=HOME="/root",USER="root"
stderr_logfile=/var/log/supervisor/hopper-idle-agent.err.log
stdout_logfile=/var/log/supervisor/hopper-idle-agent.out.log
