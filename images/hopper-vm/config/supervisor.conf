# images/hopper-vm/config/supervisord.conf
[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:code-server]
# code-server reads $PASSWORD at start-up so we just have to inherit the env
# from the pod (where the orchestrator sets it). Auto-restart with a small
# back-off so a continuously-failing process surfaces as a crash loop instead
# of pegging CPU on respawns.
command=/usr/bin/code-server --config /root/.config/code-server/config.yaml --trusted-origins=https://hopper.farefin.com /workspace
autostart=true
autorestart=true
startsecs=5
startretries=3
environment=HOME="/root",USER="root",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s"
stderr_logfile=/var/log/supervisor/code-server.err.log
stdout_logfile=/var/log/supervisor/code-server.out.log
