apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: pod-create-terminate-race
  namespace: hopper-system
spec:
  mode: all
  selector:
    namespaces: [hopper-system]
    labelSelectors:
      app.kubernetes.io/component: orchestrator
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: 5m

