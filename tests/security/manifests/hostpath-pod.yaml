apiVersion: v1
kind: Pod
metadata:
  name: security-hostpath-attempt
  namespace: hopper
spec:
  restartPolicy: Never
  containers:
    - name: attempt
      image: busybox:1.36
      command: ["sleep", "30"]
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /

