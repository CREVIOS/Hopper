##############################################################################
# API Gateway (FastAPI) — The brain of the platform
#
# Teaching: This is the only service that talks to the outside world (via
# Ingress). It handles auth, pod CRUD, credits, and admin endpoints.
# Environment variables configure it to find other services by their
# K8s Service DNS names (e.g., "postgres" resolves to the postgres pod).
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hopper
spec:
  # 2 replicas for availability: one can die (OOM, node eviction, rollout)
  # without dropping the API. Safe to scale horizontally — NATS consumers are
  # queue-grouped across replicas, terminal/SSE connections are self-contained
  # in whichever replica accepted them, and the session reaper locks rows with
  # SKIP LOCKED.
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: orchestrator
      # Pods on this cluster cannot egress to external SMTP ports (25/465/587
      # time out; only the node can reach them). Verification / reset emails are
      # therefore relayed through the node: a systemd `hopper-smtp-relay` unit
      # (see k8s/deploy/node/hopper-smtp-relay.service) runs
      #   socat TCP-LISTEN:2525,fork TCP:smtp.gmail.com:587
      # on the node (10.0.0.6). This hostAlias makes the pod resolve
      # smtp.gmail.com to the node so STARTTLS still validates Gmail's cert
      # end-to-end, while HOPPER_SMTP_PORT below points at the relay's 2525.
      hostAliases:
        - ip: "10.0.0.6"
          hostnames: ["smtp.gmail.com"]
      containers:
        - name: api-gateway
          image: hopper/api-gateway:latest
          imagePullPolicy: Never
          # Override Dockerfile CMD so uvicorn trusts the nginx ingress's
          # X-Forwarded-Proto header (otherwise FastAPI's auto-redirects build
          # http:// URLs and the browser never reaches the secure callback).
          command: ["uvicorn"]
          args:
            - "app.main:app"
            - "--host=0.0.0.0"
            - "--port=8000"
            # 2 workers fit comfortably in the 1Gi limit alongside terminal/SSH
            # sessions (each ~100MB + a kubectl port-forward subprocess). 4
            # workers idled near the old 512Mi cap and got OOM/liveness-killed
            # the moment a terminal opened.
            - "--workers=2"
            - "--proxy-headers"
            - "--forwarded-allow-ips=*"
          ports:
            - containerPort: 8000
          env:
            # DB URL is sourced from the hopper-db Secret so credentials
            # rotate without a manifest change. The secret is the canonical
            # source — never duplicate the password into env-value.
            - name: HOPPER_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hopper-db, key: database-url }
            - name: HOPPER_NATS_URL
              value: "nats://nats:4222"
            - name: HOPPER_KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: HOPPER_KEYCLOAK_EXTERNAL_URL
              value: "https://hopper.farefin.com"
            - name: HOPPER_KEYCLOAK_REALM
              value: "hopper"
            - name: HOPPER_KEYCLOAK_CLIENT_ID
              value: "hopper-api"
            # Secret for the confidential `hopper-admin` service-account client
            # (signup / role changes / forced logout). Sourced from the
            # hopper-keycloak-admin Secret — see 00-secrets.yaml.
            - name: HOPPER_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: hopper-keycloak-admin, key: client-secret }
            # Brevo transactional-email HTTPS API key (preferred transport):
            # pods can egress :443 (unlike SMTP ports), and a Brevo sender with
            # domain authentication keeps verification codes out of spam, which
            # the personal-Gmail SMTP path could not. Sourced from the
            # hopper-brevo Secret — see 00-secrets.yaml. Optional: absent Secret
            # falls back to the SMTP transport below.
            - name: HOPPER_BREVO_API_KEY
              valueFrom:
                secretKeyRef: { name: hopper-brevo, key: api-key, optional: true }
            # SMTP for signup verification + password-reset emails — fallback
            # transport when Brevo is unset or a Brevo send fails. Sourced from
            # the hopper-smtp Secret; refs are optional so a missing/empty Secret
            # degrades to DEV mode (codes logged, not sent) instead of breaking
            # the pod. See 00-secrets.yaml.
            - name: HOPPER_SMTP_HOST
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-host, optional: true }
            - name: HOPPER_SMTP_USER
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-user, optional: true }
            - name: HOPPER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-password, optional: true }
            - name: HOPPER_SMTP_FROM
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-from, optional: true }
            # 2525 = the node SMTP relay (see hostAliases above), not Gmail's
            # 587 directly — pods can't egress to SMTP ports. STARTTLS still
            # runs end-to-end to real Gmail through the relay.
            - name: HOPPER_SMTP_PORT
              value: "2525"
            - name: HOPPER_SMTP_STARTTLS
              value: "true"
            - name: HOPPER_CORS_ORIGINS
              value: '["https://hopper.farefin.com"]'
            - name: HOPPER_ORCHESTRATOR_URL
              value: "orchestrator:50051"
            - name: HOPPER_FRONTEND_URL
              value: "https://hopper.farefin.com"
            - name: HOPPER_CALLBACK_URL
              value: "https://hopper.farefin.com/api/auth/callback"
            - name: HOPPER_DEBUG
              value: "true"
            - name: HOPPER_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # Readiness = deep dependency checks (/readyz probes DB + NATS and
          # reports orchestrator health); a degraded pod is pulled from the
          # Service without being killed. Liveness stays on the shallow
          # /healthz — restarting the pod can't fix a down database, so deep
          # checks there would restart-loop the gateway during infra outages.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hopper
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000

---
##############################################################################
# Orchestrator (Go + gRPC) — Manages pod lifecycle on Kubernetes
#
# Teaching: The orchestrator talks directly to the Kubernetes API to create
# and delete pods. It needs a ServiceAccount with permissions to do this
# (RBAC). It also connects to NATS to receive events from the API gateway.
##############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: hopper
---
# Teaching: RBAC (Role-Based Access Control) — This gives the orchestrator
# permission to create/delete pods in the hopper namespace ONLY.
# Without this, K8s blocks it. Principle of least privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-role
  namespace: hopper
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
# ClusterRole for reading node info (needed for admin /nodes endpoint)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: hopper
roleRef:
  kind: ClusterRole
  name: orchestrator-node-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-binding
  namespace: hopper
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: hopper
roleRef:
  kind: Role
  name: orchestrator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: hopper
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the orchestrator owns the billing tickers.
  # A rolling update runs old + new pods side by side — two tickers billing
  # every VM. Leader election (below) also guards this, but not overlapping
  # at all is the cheapest correctness. The brief gRPC gap during a deploy
  # only delays VM create/terminate; the gateway tolerates it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: hopper/orchestrator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: HOPPER_NATS_URL
              value: "nats://nats:4222"
            - name: GRPC_PORT
              value: "50051"
            - name: KUBERNETES_NAMESPACE
              value: "hopper"
            # Gate billing tickers / pod watcher behind a K8s Lease so a
            # second instance (misconfig, future scale-out) can never
            # double-bill. Uses the leases RBAC granted to this SA.
            - name: HOPPER_LEADER_ELECTION
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Native gRPC probes against grpc.health.v1.Health. Readiness uses
          # the default ("") service, which the orchestrator flips to
          # NOT_SERVING when it loses NATS or the K8s API — real dependency
          # health. Liveness probes the dedicated "liveness" service that
          # stays SERVING while the process is up: restarting the pod can't
          # fix a NATS outage, and tying liveness to dependencies would
          # restart-loop through the whole outage.
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
              service: liveness
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: hopper
spec:
  selector:
    app: orchestrator
  ports:
    - port: 50051
      targetPort: 50051

---
##############################################################################
# Frontend (SvelteKit) — The web UI users interact with
#
# Teaching: SvelteKit builds to a Node.js server. It serves the HTML/CSS/JS
# and also does server-side rendering (SSR) — meaning the first page load
# is fast because the server renders HTML before sending it to the browser.
##############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hopper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hopper/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PUBLIC_API_URL
              value: "/api"
            - name: ORIGIN
              value: "https://hopper.farefin.com"
            - name: API_INTERNAL_URL
              value: "http://api-gateway:8000"
            # Public host that NodePort SSH/VS Code services are reachable on.
            # NodePorts (30000–32767) must be open on the firewall pointing here.
            - name: NODE_IP
              value: "hopper.farefin.com"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hopper
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
