##############################################################################
# Secrets — credentials referenced by 01-infra.yaml and 02-apps.yaml
#
# Note: this file replaces plaintext passwords previously embedded directly
# in deployment env. Values here are still base64 of the dev defaults;
# rotate to real, randomly-generated values before any non-dev deployment.
#
# To rotate (example):
#   NEW_PASS="$(openssl rand -base64 24)"
#   kubectl create secret generic hopper-db -n hopper \
#     --from-literal=password="$NEW_PASS" \
#     --from-literal=database-url="postgresql+asyncpg://hopper:$NEW_PASS@postgres:5432/hopper" \
#     --from-literal=jdbc-url="jdbc:postgresql://postgres:5432/hopper" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   # then rotate the actual postgres role and rollout-restart consumers.
##############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: hopper-db
  namespace: hopper
type: Opaque
stringData:
  username: "hopper"
  password: "hopper_dev"
  database-url: "postgresql+asyncpg://hopper:hopper_dev@postgres:5432/hopper"
  jdbc-url: "jdbc:postgresql://postgres:5432/hopper"

---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: hopper
type: Opaque
stringData:
  username: "admin"
  password: "admin"

---
# Confidential service-account client `hopper-admin` (client_credentials grant)
# used by the api-gateway for Keycloak mutations: self-service signup
# (create_user), teacher approval / role changes (set_user_role), and forced
# logout. See services/api-gateway/app/services/keycloak_admin.py.
#
# Referenced by api-gateway as HOPPER_KEYCLOAK_ADMIN_CLIENT_SECRET (02-apps.yaml).
#
# IMPORTANT: `client-secret` below is a PLACEHOLDER. The real value is created
# out-of-band in the cluster (this repo is public — never commit the real
# secret). Do NOT `kubectl apply` this Secret over prod or it will overwrite
# the live value and break signup/role changes. Provision/rotate in-cluster:
#   kubectl create secret generic hopper-keycloak-admin -n hopper \
#     --from-literal=client-secret="<hopper-admin client secret from Keycloak>" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: hopper-keycloak-admin
  namespace: hopper
type: Opaque
stringData:
  client-secret: "REPLACE_ME_hopper_admin_client_secret"
