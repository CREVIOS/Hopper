##############################################################################
# Cert-Manager — Let's Encrypt ClusterIssuers
#
# Prereqs: cert-manager itself must be installed first:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
#
# After both ClusterIssuers exist, the ingresses in 03-ingress.yaml will
# auto-provision certs via the HTTP-01 challenge through the nginx ingress.
#
# Two important post-install patches required on Azure VMs (no NAT loopback):
#   1. Patch cert-manager pod with a hostAlias so its self-check resolves
#      hopper.farefin.com → node IP (10.0.0.6) and bypasses the public IP:
#        kubectl patch deploy cert-manager -n cert-manager --type=strategic -p \
#          '{"spec":{"template":{"spec":{"hostAliases":[{"ip":"10.0.0.6","hostnames":["hopper.farefin.com"]}]}}}}'
#   2. Network policy `allow-acme-http-solver` in 04-network-policies.yaml
#      allows ingress traffic to the solver pods that cert-manager spins up.
##############################################################################

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: asif@askturing.ai
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: asif@askturing.ai
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            class: nginx
