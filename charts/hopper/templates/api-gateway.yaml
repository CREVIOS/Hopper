##############################################################################
# API Gateway (port of k8s/deploy/02-apps.yaml)
##############################################################################
{{- $host := .Values.global.host }}
{{- $scheme := .Values.global.scheme }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  # 2 replicas for availability: safe to scale horizontally — NATS consumers
  # are queue-grouped across replicas, terminal/SSE connections are
  # self-contained in whichever replica accepted them, and the session
  # reaper locks rows with SKIP LOCKED.
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Uses the orchestrator SA: the in-browser terminal / VS Code proxy
      # needs pods/portforward RBAC.
      serviceAccountName: orchestrator
      {{- if .Values.apiGateway.smtpRelay.enabled }}
      # Pods on this cluster cannot egress to external SMTP ports; emails are
      # relayed through a socat unit on the node (see
      # k8s/deploy/node/hopper-smtp-relay.service). The hostAlias makes the
      # pod resolve smtp.gmail.com to the node so STARTTLS still validates
      # Gmail's cert end-to-end.
      hostAliases:
        - ip: {{ .Values.apiGateway.smtpRelay.nodeIP | quote }}
          hostnames: ["smtp.gmail.com"]
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "hopper.image" (dict "root" . "component" .Values.apiGateway) }}
          imagePullPolicy: {{ .Values.apiGateway.imagePullPolicy }}
          # Override Dockerfile CMD so uvicorn trusts the nginx ingress's
          # X-Forwarded-Proto header.
          command: ["uvicorn"]
          args:
            - "app.main:app"
            - "--host=0.0.0.0"
            - "--port=8000"
            # 2 workers fit comfortably in the 1Gi limit alongside
            # terminal/SSH sessions; 4 workers OOM'd under the old 512Mi cap.
            - "--workers={{ .Values.apiGateway.workers }}"
            - "--proxy-headers"
            - "--forwarded-allow-ips=*"
          ports:
            - containerPort: 8000
          env:
            # DB URL is sourced from the hopper-db Secret so credentials
            # rotate without a manifest change.
            - name: HOPPER_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hopper-db, key: database-url }
            - name: HOPPER_NATS_URL
              value: "nats://nats:4222"
            - name: HOPPER_KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: HOPPER_KEYCLOAK_EXTERNAL_URL
              value: "{{ $scheme }}://{{ $host }}"
            - name: HOPPER_KEYCLOAK_REALM
              value: "hopper"
            - name: HOPPER_KEYCLOAK_CLIENT_ID
              value: "hopper-api"
            - name: HOPPER_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: hopper-keycloak-admin, key: client-secret }
            # Brevo HTTPS email (preferred transport); optional — absent
            # Secret falls back to SMTP / DEV mode.
            - name: HOPPER_BREVO_API_KEY
              valueFrom:
                secretKeyRef: { name: hopper-brevo, key: api-key, optional: true }
            - name: HOPPER_SMTP_HOST
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-host, optional: true }
            - name: HOPPER_SMTP_USER
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-user, optional: true }
            - name: HOPPER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-password, optional: true }
            - name: HOPPER_SMTP_FROM
              valueFrom:
                secretKeyRef: { name: hopper-smtp, key: smtp-from, optional: true }
            {{- if .Values.apiGateway.smtpRelay.enabled }}
            # The node relay's listen port, not Gmail's 587 — see hostAliases.
            - name: HOPPER_SMTP_PORT
              value: {{ .Values.apiGateway.smtpRelay.port | quote }}
            {{- end }}
            - name: HOPPER_SMTP_STARTTLS
              value: "true"
            - name: HOPPER_CORS_ORIGINS
              value: '["{{ $scheme }}://{{ $host }}"]'
            - name: HOPPER_ORCHESTRATOR_URL
              value: "orchestrator:50051"
            - name: HOPPER_FRONTEND_URL
              value: "{{ $scheme }}://{{ $host }}"
            - name: HOPPER_CALLBACK_URL
              value: "{{ $scheme }}://{{ $host }}/api/auth/callback"
            - name: HOPPER_DEBUG
              value: {{ .Values.apiGateway.debug | quote }}
            - name: HOPPER_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # Readiness = deep dependency checks (/readyz probes DB + NATS);
          # liveness stays on the shallow /healthz so an infra outage doesn't
          # restart-loop the gateway.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
