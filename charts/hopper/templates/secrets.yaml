{{- if .Values.secrets.create }}
##############################################################################
# Secrets — rendered ONLY when secrets.create=true (disposable dev envs).
# In production the Secrets are provisioned out-of-band (this repo is
# public); a helm upgrade must never overwrite the live values. See
# k8s/deploy/00-secrets.yaml for the rotation runbooks.
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: hopper-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.secrets.db.username | quote }}
  password: {{ .Values.secrets.db.password | quote }}
  database-url: "postgresql+asyncpg://{{ .Values.secrets.db.username }}:{{ .Values.secrets.db.password }}@postgres:5432/{{ .Values.postgres.database }}"
  jdbc-url: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.secrets.keycloakAdmin.username | quote }}
  password: {{ .Values.secrets.keycloakAdmin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hopper-keycloak-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.secrets.keycloakAdminClient.clientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hopper-brevo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.brevo.apiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hopper-smtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  smtp-host: {{ .Values.secrets.smtp.host | quote }}
  smtp-user: {{ .Values.secrets.smtp.user | quote }}
  smtp-password: {{ .Values.secrets.smtp.password | quote }}
  smtp-from: {{ .Values.secrets.smtp.from | quote }}
{{- end }}
