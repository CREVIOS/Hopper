{{- if .Values.backup.enabled }}
##############################################################################
# Nightly Postgres backups (port of k8s/deploy/06-backup.yaml, HOP-21 §24.2)
# Restore runbook: see the header of k8s/deploy/06-backup.yaml.
##############################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backup.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            # Matched by the allow-pg-backup NetworkPolicies below — without
            # them the default-deny policy silently times out the postgres
            # connection.
            app: pg-backup
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              # Client major must match the server major (pg16).
              image: {{ .Values.backup.image }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # The secret stores the SQLAlchemy URL; strip the driver
                  # suffix for libpq.
                  DB_URL=$(printf '%s' "$HOPPER_DATABASE_URL" | sed 's/+asyncpg//')
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  echo "dumping to hopper-${STAMP}.dump"
                  pg_dump --format=custom --file="/backups/hopper-${STAMP}.dump" "$DB_URL"
                  find /backups -name 'hopper-*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
                  echo "done:"; ls -lh /backups | tail -5
              env:
                - name: HOPPER_DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: hopper-db, key: database-url }
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pg-backup-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: pg-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hopper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pg-backup
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
