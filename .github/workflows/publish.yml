name: Publish images

# Push Hopper service images to GHCR on: merge to main/master (push), version tags (v*),
# or manual workflow_dispatch. Optionally roll out with scripts/cd/k8s-rollout.sh (kubectl).
#
# Continuous deployment (after images are pushed):
#   • Secret KUBE_CONFIG — full kubeconfig YAML (cluster must be able to pull from GHCR).
#   • Variable AUTO_DEPLOY_K8S — set exactly to "true" to roll out on every successful push to
#     main/master or to a v* tag. Any other value or unset = no automatic rollout.
#   • Manual CD: Actions → Publish images → Run workflow → set "deploy" to true.
#
# Configure GHCR package permissions if this is the first publish:
#   Package settings → Actions → allow workflows from this repo.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "After image push, run kubectl rollout (needs KUBE_CONFIG; same as AUTO_DEPLOY_K8S=true on push)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      api_image: ${{ steps.vars.outputs.api_image }}
      orchestrator_image: ${{ steps.vars.outputs.orchestrator_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: vars
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          TAG=$(echo '${{ github.sha }}' | cut -c1-12)
          REG="ghcr.io/${OWNER_LC}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REG}/hopper-api-gateway:${TAG}" >> "$GITHUB_OUTPUT"
          echo "orchestrator_image=${REG}/hopper-orchestrator:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REG}/hopper-frontend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=${REG}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          chmod +x scripts/ci/docker-build.sh
          DOCKER_PUSH=1 REGISTRY="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" TAG="${{ steps.vars.outputs.tag }}" ./scripts/ci/docker-build.sh

  deploy:
    needs: build-push
    if: |
      needs.build-push.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
        (github.event_name == 'push' && vars.AUTO_DEPLOY_K8S == 'true' && (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is empty" >&2
            exit 1
          fi
          printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config

      - name: Roll out
        env:
          NAMESPACE: hopper
          USE_REGISTRY: "1"
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          ORCHESTRATOR_IMAGE: ${{ needs.build-push.outputs.orchestrator_image }}
          FRONTEND_IMAGE: ${{ needs.build-push.outputs.frontend_image }}
        run: |
          chmod +x scripts/cd/k8s-rollout.sh
          ./scripts/cd/k8s-rollout.sh
