name: Publish images

# Push Hopper service images to GHCR on: merge to main/master (push), version tags (v*),
# or manual workflow_dispatch. Optional rollout runs kubectl on the VPS over SSH (Plan A).
#
# CD secrets (deploy job — SSH into the VPS, then kubectl there against local/private API):
#   VPS_SSH_KEY          — private key (full PEM/ed25519, include BEGIN/END lines)
#   VPS_HOST             — VPS hostname or IP (SSH must be reachable from GitHub)
#   VPS_USER             — SSH login user (use a dedicated deploy user + forced command when possible)
#   VPS_SSH_KNOWN_HOSTS  — optional; output of: ssh-keyscan -H YOUR_VPS_HOST
#                         If unset, the workflow runs ssh-keyscan once (pin this secret for MITM safety).
#
# Optional repo variable VPS_KUBECTL — e.g. "k3s kubectl" if system kubectl cannot talk to k3s (discovery /api errors).
#
# Repo variable AUTO_DEPLOY_K8S — set exactly to "true" to roll out after every successful push to
# main/master or v* tag. Manual: Actions → Publish images → Run workflow → deploy = true.
#
# VPS must have kubectl working locally (e.g. k3s) and nodes able to pull from GHCR.
#
# Configure GHCR package permissions if this is the first publish:
#   Package settings → Actions → allow workflows from this repo.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "After image push, SSH to VPS and run kubectl rollout (needs VPS_* secrets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      api_image: ${{ steps.vars.outputs.api_image }}
      orchestrator_image: ${{ steps.vars.outputs.orchestrator_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: vars
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          TAG=$(echo '${{ github.sha }}' | cut -c1-12)
          REG="ghcr.io/${OWNER_LC}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REG}/hopper-api-gateway:${TAG}" >> "$GITHUB_OUTPUT"
          echo "orchestrator_image=${REG}/hopper-orchestrator:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REG}/hopper-frontend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=${REG}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          chmod +x scripts/ci/docker-build.sh
          DOCKER_PUSH=1 REGISTRY="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" TAG="${{ steps.vars.outputs.tag }}" ./scripts/ci/docker-build.sh

  deploy:
    needs: build-push
    if: |
      needs.build-push.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
        (github.event_name == 'push' && vars.AUTO_DEPLOY_K8S == 'true' && (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Roll out over SSH (kubectl on VPS)
        env:
          NAMESPACE: hopper
          USE_REGISTRY: "1"
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          ORCHESTRATOR_IMAGE: ${{ needs.build-push.outputs.orchestrator_image }}
          FRONTEND_IMAGE: ${{ needs.build-push.outputs.frontend_image }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          KUBECTL: ${{ vars.VPS_KUBECTL }}
        run: |
          set -euo pipefail
          for name in VPS_SSH_KEY VPS_HOST VPS_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/hopper_cd_deploy
          chmod 600 ~/.ssh/hopper_cd_deploy

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "VPS_SSH_KNOWN_HOSTS unset; running ssh-keyscan (add secret to pin host keys)"
            ssh-keyscan -H -T 30 "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

          ssh -i ~/.ssh/hopper_cd_deploy \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${VPS_USER}@${VPS_HOST}" \
            env NAMESPACE="$NAMESPACE" USE_REGISTRY="$USE_REGISTRY" \
            API_IMAGE="$API_IMAGE" ORCHESTRATOR_IMAGE="$ORCHESTRATOR_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            KUBECTL="${KUBECTL:-}" \
            bash -s < scripts/cd/k8s-rollout.sh
