name: Lint (Python)

# Ruff on api-gateway. Enforcing: the tree is Ruff-clean as of the unused-import
# cleanup, so failures here are real regressions.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install deps
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Ruff
        working-directory: services/api-gateway
        run: poetry run ruff check .
