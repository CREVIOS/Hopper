name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pnpm 9 rejects frontend/pnpm-workspace.yaml ("packages field
          # missing or empty") — that file exists for pnpm 10+ hosts (build
          # allowlist, added in #63) and has broken this job on every push
          # since. pnpm 10 accepts it and matches local development. The
          # Docker image build keeps its own pnpm 9 pin and excludes the
          # file via frontend/.dockerignore.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend validate
        run: ./scripts/test/run.sh frontend-validate

      - name: Frontend coverage
        run: |
          cd frontend
          npx vitest run --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend
          if-no-files-found: ignore

  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install deps
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Import smoke
        working-directory: services/api-gateway
        run: poetry run python -c "from app.main import app; print('app.main OK')"

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Run Python unit tests
        run: ./scripts/test/run.sh test-unit

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-unit-coverage
          path: coverage/python/unit.xml
          if-no-files-found: ignore

  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: services/orchestrator/go.sum

      - name: Run orchestrator contract and fake-client integration tests
        run: ./scripts/test/run.sh test-orchestrator

      - name: Upload orchestrator coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-coverage
          path: coverage/orchestrator/orchestrator.out
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install deps
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Integration tests (Testcontainers)
        run: ./scripts/test/run.sh test-integration

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-integration-coverage
          path: coverage/python/integration.xml
          if-no-files-found: ignore

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          CI: "true"
        run: ./scripts/test/run.sh test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images (smoke)
        run: |
          chmod +x scripts/ci/docker-build.sh
          TAG="ci-${{ github.sha }}" ./scripts/ci/docker-build.sh
