name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend validate
        run: ./scripts/test/run.sh frontend-validate

      - name: Frontend tests with coverage
        run: ./scripts/test/run.sh test-frontend

      - name: Upload frontend coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            coverage/frontend
            tests/coverage/frontend
            test-results/frontend
          if-no-files-found: error

  api-gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install API dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Import smoke
        working-directory: services/api-gateway
        run: poetry run python -c "from app.main import app; print('app.main OK')"

  python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install API dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Run Python unit tests
        run: ./scripts/test/run.sh test-unit

      - name: Upload Python unit coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-unit-artifacts
          path: |
            coverage/python/unit.xml
            tests/coverage/python/unit
            test-results/unit
          if-no-files-found: error

  python-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install API dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Start deterministic services
        run: ./scripts/test/run.sh test-services-up

      - name: Run database migrations
        run: ./scripts/test/run.sh test-migrate

      - name: Capture mock service logs
        if: always()
        run: ./scripts/test/run.sh test-service-logs

      - name: Stop deterministic services
        if: always()
        run: ./scripts/test/run.sh test-services-down

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-artifacts
          path: test-results/services
          if-no-files-found: error

  python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install API dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Run Python integration tests
        run: ./scripts/test/run.sh test-integration

      - name: Upload Python integration coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-integration-artifacts
          path: |
            coverage/python/integration.xml
            tests/coverage/python/integration
            test-results/integration
          if-no-files-found: error

  go-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: services/orchestrator/go.sum

      - name: Run Go orchestrator tests
        run: ./scripts/test/run.sh test-orchestrator

      - name: Upload Go orchestrator coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-orchestrator-artifacts
          path: |
            coverage/orchestrator/orchestrator-internal-k8s.out
            tests/coverage/orchestrator/internal
            test-results/orchestrator
          if-no-files-found: error

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: tests/orchestrator/go.sum

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.4

      - name: Install API dependencies
        working-directory: services/api-gateway
        run: poetry install --no-interaction

      - name: Run contract suites
        run: ./scripts/test/run.sh test-contract

      - name: Upload contract coverage and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            coverage/orchestrator/orchestrator-contract.out
            tests/coverage/orchestrator/contract
            test-results/contracts
          if-no-files-found: error

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint and render chart overlays
        run: |
          set -euo pipefail
          helm lint charts/hopper -f charts/hopper/values-prod.yaml
          for v in dev staging prod; do
            helm template hopper charts/hopper -n hopper \
              -f "charts/hopper/values-$v.yaml" > /dev/null
            echo "values-$v.yaml renders OK"
          done

  lint-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: services/orchestrator/go.sum

      - name: Generate orchestrator proto stubs
        working-directory: services/orchestrator
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0
          mkdir -p api/proto/hopper/pod/v1 api/proto/hopper/billing/v1
          protoc --proto_path=proto \
            --go_out=api/proto --go_opt=paths=source_relative \
            --go-grpc_out=api/proto --go-grpc_opt=paths=source_relative \
            proto/hopper/pod/v1/pod.proto \
            proto/hopper/billing/v1/billing.proto

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.6.2

      - name: Lint orchestrator
        working-directory: services/orchestrator
        run: golangci-lint run --timeout 5m ./...

      - name: Lint contract tests
        working-directory: tests/orchestrator
        run: golangci-lint run --timeout 5m ./...

  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Start deterministic services
        run: ./scripts/test/run.sh test-services-up

      - name: Run mock-backed Playwright E2E
        env:
          CI: "true"
        run: ./scripts/test/run.sh test-e2e

      - name: Capture mock service logs
        if: always()
        run: ./scripts/test/run.sh test-service-logs

      - name: Stop deterministic services
        if: always()
        run: ./scripts/test/run.sh test-services-down

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mock-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            test-results/e2e
            test-results/services
          if-no-files-found: error
          retention-days: 14

  coverage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - frontend
      - python-unit
      - python-integration
      - go-orchestrator
      - contract-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-artifacts
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: python-unit-artifacts
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: python-integration-artifacts
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: go-orchestrator-artifacts
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: .

      - name: Render combined coverage report
        run: ./scripts/test/run.sh test-coverage-report

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images (smoke)
        run: |
          chmod +x scripts/ci/docker-build.sh
          TAG="ci-${{ github.sha }}" ./scripts/ci/docker-build.sh
