---
# Hopper cluster provisioning.
#
# Scope today: join worker machines to an EXISTING k3s cluster as VM hosts. The
# control-plane (k8s_masters) is assumed already up — it is the machine you ran
# the k3s server installer on by hand, the one holding the app deployment. This
# playbook does not (re)provision it.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml
# with K3S_URL and K3S_TOKEN exported (see group_vars/k8s_workers.yml) and a full
# walkthrough in docs/NODE_JOIN.md.

- name: Base setup for all hosts
  hosts: all
  become: true
  tasks:
    - name: Install common dependencies
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

- name: Join worker nodes as VM hosts
  hosts: k8s_workers
  become: true
  roles:
    - k3s-agent
