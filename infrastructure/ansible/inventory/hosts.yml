---
# Hopper cluster inventory. Replace the example hosts/IPs with your own.
#
# - k8s_masters: the existing k3s SERVER (control-plane). Already running; used
#   here only as the machine that labels newly-joined nodes (it has kubectl).
# - k8s_workers: the machines you want to ADD as VM hosts. This is where "use a
#   random PC as a Hopper node" happens — list the PC here and run site.yml.
#
# ansible_host is the address Ansible SSHes to. If a worker is off-site, put it
# and the server on a WireGuard/Tailscale overlay first and use the overlay
# addresses here and in k3s_url (never expose the k3s API on the public net).

all:
  children:
    k8s_masters:
      hosts:
        server-01:
          # The control-plane you already stood up. Example prod value: 10.0.0.6
          ansible_host: 10.0.0.6

    k8s_workers:
      hosts:
        worker-01:
          # The extra PC to enroll. Any Debian/Ubuntu machine with SSH.
          ansible_host: 10.0.0.20
        # worker-02:
        #   ansible_host: 10.0.0.21

  vars:
    ansible_user: hopper
    ansible_become: true
