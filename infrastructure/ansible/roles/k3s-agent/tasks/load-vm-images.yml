---
# Make the VM template images available in this node's containerd. VM pods are
# scheduled IfNotPresent against bare names like hopper/vm-ubuntu:22.04 with no
# registry fallback, so a node without them gives ImagePullBackOff. Two paths:
# pull-and-retag from a registry, or import staged tarballs.

- name: Import VM images from a registry
  when: vm_image_registry | length > 0
  block:
    - name: Pull VM images from the registry
      ansible.builtin.command:
        cmd: "k3s ctr images pull {{ vm_image_registry }}/{{ item }}"
      loop: "{{ vm_images }}"
      register: pull_result
      changed_when: "'downloading' in (pull_result.stdout | default(''))"

    - name: Retag registry images to the bare names the pod spec uses
      ansible.builtin.command:
        cmd: "k3s ctr images tag --force {{ vm_image_registry }}/{{ item }} {{ item }}"
      loop: "{{ vm_images }}"
      changed_when: true

- name: Import VM images from staged tarballs
  when: vm_image_registry | length == 0
  block:
    - name: Check for staged image tarballs
      ansible.builtin.stat:
        path: "{{ vm_image_tarball_dir }}/{{ item | replace('/', '_') | replace(':', '_') }}.tar"
      loop: "{{ vm_images }}"
      register: tarball_stat

    - name: Fail if a required tarball is missing
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          Missing VM image tarball {{ item.invocation.module_args.path }}.
          Build the images (make vm-images) and copy the tarballs here, or set
          vm_image_registry. See docs/NODE_JOIN.md.
      loop: "{{ tarball_stat.results }}"
      loop_control:
        label: "{{ item.invocation.module_args.path }}"

    - name: Import each tarball into containerd
      ansible.builtin.command:
        cmd: >-
          k3s ctr images import
          {{ vm_image_tarball_dir }}/{{ item | replace('/', '_') | replace(':', '_') }}.tar
      loop: "{{ vm_images }}"
      changed_when: true
