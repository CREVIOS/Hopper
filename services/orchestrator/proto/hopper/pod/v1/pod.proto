syntax = "proto3";

package hopper.pod.v1;

option go_package = "github.com/hopper/orchestrator/api/proto/pod/v1;podv1";

import "google/protobuf/timestamp.proto";

service PodOrchestrator {
  rpc CreatePod(CreatePodRequest) returns (PodStatus);
  rpc TerminatePod(PodId) returns (TerminateResponse);
  rpc GetPodStatus(PodId) returns (PodStatus);
  rpc StreamMetrics(PodId) returns (stream VmMetrics);
  rpc WatchPodStatus(PodId) returns (stream PodStatus);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}

message PodId {
  string id = 1;
}

message CreatePodRequest {
  string user_id = 1;
  string plan = 2;
  string image = 3;
  string cpu = 4;
  string memory = 5;
  map<string, string> labels = 6;
  string disk = 7;
  // API-side pod UUID — used as the canonical pod identity for labels and
  // code-server's --base-path so that external URLs (path-based code access)
  // match the same identifier the API and frontend use.
  string pod_id = 8;
  // OpenSSH-format public keys the launching user has registered. Injected
  // into the VM's /root/.ssh/authorized_keys so key-based SSH works (the
  // key CRUD previously stored keys that never reached the VM). Public keys
  // are not secret, so passing them in the request (vs a Secret) is fine.
  repeated string authorized_keys = 9;
  // Persistent per-user workspace (FR-HC-28). When workspace_pvc_name is set,
  // the orchestrator ensures a ReadWriteOnce PVC of that name exists (creating
  // it lazily, without a pod owner-reference so it outlives the pod) and mounts
  // it read-write at /workspace. It is never deleted by the session lifecycle
  // — its distinct name (ws-user-<id>) is outside DeletePod's ws-<pod> scope.
  string workspace_pvc_name = 10;
  int32 workspace_capacity_gb = 11;
  // K8s StorageClassName for the workspace PVC; empty uses the cluster default.
  string storage_class = 12;
  // Credits-per-hour billing rate for the chosen plan, resolved by the gateway
  // from its (now DB-backed) plan catalogue. The orchestrator bills at this
  // rate instead of a hardcoded map; when 0 it falls back to the built-in
  // Plans map for backward compatibility with older gateways.
  double credits_per_hour = 13;
}

message PodStatus {
  string id = 1;
  string user_id = 2;
  PodState state = 3;
  string plan = 4;
  string node_name = 5;
  string namespace = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string message = 9;
  int32 ssh_port = 10;
  int32 vscode_port = 13;
  string cpu = 11;
  string memory = 12;
  string ssh_password = 14;
}

enum PodState {
  POD_STATE_UNSPECIFIED = 0;
  POD_STATE_PENDING = 1;
  POD_STATE_CREATING = 2;
  POD_STATE_RUNNING = 3;
  POD_STATE_STOPPING = 4;
  POD_STATE_TERMINATED = 5;
  POD_STATE_FAILED = 6;
}

message TerminateResponse {
  bool success = 1;
  string message = 2;
}

message VmMetrics {
  string pod_id = 1;
  double cpu_percent = 2;
  int64 memory_used_bytes = 3;
  int64 memory_limit_bytes = 4;
  double disk_used_bytes = 5;
  double disk_limit_bytes = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message ListNodesRequest {}

message NodeInfo {
  string name = 1;
  string cpu_capacity = 2;
  string memory_capacity = 3;
  string cpu_allocatable = 4;
  string memory_allocatable = 5;
  int32 pod_count = 6;
  bool ready = 7;
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}
